; PlatformIO para receptor LoRa con sincronización
; TTGO LoRa32 V2.1.6
;
; Configurar credenciales WiFi y IP del WLED:
;   pio run -e ttgo-lora32-v21 -t upload \
;     -DWIFI_SSID=\"MiRed\" \
;     -DWIFI_PASS=\"MiPassword\" \
;     -DWLED_IP=\"192.168.1.100\"

[env:ttgo-lora32-v21]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200

lib_deps =
    jgromes/RadioLib@^6.4.0
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    bblanchon/ArduinoJson@^6.21.3

build_flags =
    -DARDUINO_TTGO_LoRa32_V21new
    -DCORE_DEBUG_LEVEL=0
    ; Descomentar y configurar para tu red:
    ; -DWIFI_SSID=\"TuSSID\"
    ; -DWIFI_PASS=\"TuPassword\"
    ; -DWLED_IP=\"192.168.1.100\"

upload_speed = 921600

; Configuración para el receptor standalone (sin WLED integrado)
; Recibe LoRa y envía comandos HTTP a un WLED en otra IP
[env:receptor-standalone]
extends = env:ttgo-lora32-v21
build_flags =
    ${env:ttgo-lora32-v21.build_flags}
    -DSTANDALONE_RECEIVER=1
